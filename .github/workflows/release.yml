# Builds the source distribution and the wheel, runs the tests on Linux,
# macOS and Windows, and publishes the build.
#
# - On a pull request or a push to main: build and test only.
# - On a published GitHub release: build, test, publish to PyPI.
# - Run by hand (Actions > Release > Run workflow): build, test, and publish
#   to TestPyPI, to try a release before the real one.
#
# Publishing uses PyPI's trusted publishing: no token is stored. PyPI and
# TestPyPI each need a trusted publisher for this repository, workflow
# `release.yml`, environment `pypi` or `testpypi`.
#
# The package is pure Python, so one wheel (py3-none-any) serves every
# platform and every Python from 3.13 on.

name: Release

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Build the sdist and the wheel
        run: uv build
      - name: Upload the build
        uses: actions/upload-artifact@v6
        with:
          name: wheels-dist
          path: dist

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Run the tests
        run: uv run pytest -q

  publish-testpypi:
    name: Publish to TestPyPI
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
      - uses: astral-sh/setup-uv@v7
      - name: Publish
        run: uv publish --trusted-publishing always --publish-url https://test.pypi.org/legacy/ 'wheels-*/*'

  publish-pypi:
    name: Publish to PyPI
    if: ${{ github.event_name == 'release' }}
    needs: [build, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
      - name: Attest the build provenance
        uses: actions/attest@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: astral-sh/setup-uv@v7
      - name: Publish
        run: uv publish --trusted-publishing always 'wheels-*/*'
