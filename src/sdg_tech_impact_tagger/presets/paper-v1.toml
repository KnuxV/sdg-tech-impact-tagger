[run]
name = "paper-v1"
cache_dir = "cache"

[models.coder]
endpoint = "https://conversation.ia.unistra.fr/api"
api_key_env = "UNISTRA_API_KEY"
model = "coder"
seed = 42
temperature = 0.0
reasoning = "on"
reasoning_style = "omit"
timeout_s = 1800.0
concurrency = 8

[models.gemma]
endpoint = "https://conversation.ia.unistra.fr/api"
api_key_env = "UNISTRA_API_KEY"
model = "gemma"
seed = 42
temperature = 0.0
reasoning = "on"
reasoning_style = "enable_thinking"
timeout_s = 1800.0
concurrency = 8

[[passes]]
id = "paper_adt"
question = "paper/adt_v1"
models = ["coder", "gemma"]
units = { rule = "all" }
attempts = 4
budget_rule = "length"

[[passes]]
id = "paper_sdg"
question = "paper/sdg_v1"
models = ["coder", "gemma"]
units = { rule = "all" }
attempts = 4
budget_rule = "length"

[[passes]]
id = "paper_impact"
question = "paper/impact_v1"
models = ["coder", "gemma"]
attempts = 4
budget_rule = "length"
units = { rule = "cross", a = { from = "paper_adt", models = ["coder", "gemma"], positive = ["E", "A", "T", "M"], combine = "union" }, b = { from = "paper_sdg", models = ["coder", "gemma"], positive = ["Y"], combine = "union" } }
